name: Build and publish ebook

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-book-lock.txt
      - name: Install isolated book dependencies
        run: python -m pip install -r requirements-book-lock.txt
      - name: Verify source conversion
        run: python -m pytest -q tests/test_book.py
      - name: Read GitHub Pages URL
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build ebook and check links
        env:
          BOOK_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python -m mkdocs build --strict
          python -m book.check site
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
